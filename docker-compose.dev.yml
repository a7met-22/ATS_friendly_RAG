services:
  db:
    image: pgvector/pgvector:pg18
    container_name: ahmed-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEV_DB_USER:?DEV_DB_USER is required}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}
      POSTGRES_DB: ${DEV_DB_NAME:?DEV_DB_NAME is required}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dev_network

  redis:
    image: redis:7-alpine
    container_name: ahmed-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dev_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-resume-app-dev
    restart: unless-stopped
    init: true
    env_file:
      - .env
      - .env.development
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DEV_DB_NAME:?DEV_DB_NAME is required}
      DB_USER: ${DEV_DB_USER:?DEV_DB_USER is required}
      DB_PASSWORD: ${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      TRUST_PROXY_HEADERS: "true"
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    expose:
      - "8000"
    volumes:
      - .:/app
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - dev_network

  nginx:
    image: nginx:1.27-alpine
    container_name: rag-resume-nginx-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - dev_network

volumes:
  dev_postgres_data:
    name: rag_resume_dev_postgres_data

networks:
  dev_network:
    name: rag_resume_dev_network
    driver: bridge
