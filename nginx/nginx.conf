user  nginx;
worker_processes  auto; # استغلال كافة أنوية المعالج المتاحة تلقائياً

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048; # دعم آلاف الاتصالات المتزامنة لكل Worker
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # إخفاء إصدار Nginx للحماية من الاستطلاع
    server_tokens off;

    # تحسين الأداء وتقليل استهلاك الباندويث
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # ضغط الاستجابات النصية والـ JSON لتسريع التحميل
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # تحديد الحد الأقصى لحجم الطلبات (يتطابق مع حد الـ 20MB في FastAPI مع هامش آمن للهيدرز)
    client_max_body_size 22M;
    client_body_buffer_size 1M;

    # حماية ضد هجمات Slowloris والطلبات المعلقة
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;

    # تحديد معدل الطلبات كخط دفاع أول (DDoS Protection)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # توجيه الطلبات إلى حاوية FastAPI الداخلية
    upstream fastapi_backend {
        server app:8000;
        keepalive 32; # الحفاظ على اتصالات مفتوحة مع بايثون لتسريع الاستجابة
    }

    server {
        listen 80;
        server_name _;

        # هيدرات الأمان القياسية (OWASP Security Headers)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. مسار البث المباشر (SSE Streaming) - إعدادات خاصة لمنع التأخير
        location /api/v1/chat/ask/stream {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # تمرير هوية المستخدم الحقيقية (يتطلب TRUST_PROXY_HEADERS=true في FastAPI)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # إجبار Nginx على إرسال الكلمات فور وصولها من بايثون دون تجميع
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 120s;
        }

        # 2. مسار فحص الصحة (Health Check) بدون تسجيل أو تقييد معدل
        location /health {
            proxy_pass http://fastapi_backend;
            access_log off;
        }

        # 3. باقي مسارات الـ API والتوثيق
        location / {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
