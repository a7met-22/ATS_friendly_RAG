user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # سقف صارم 1MB لجميع طلبات JSON لمنع إغراق الذاكرة
    client_max_body_size 1M;
    client_body_buffer_size 128k;

    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;

    # قبول X-Request-ID فقط إذا طابق الصيغة الآمنة، وإلا توليد معرف جديد نظيف
    map $http_x_request_id $trace_request_id {
        "~^[a-zA-Z0-9_-]{8,64}$"  $http_x_request_id;
        default                   "gw_$request_id";
    }

    log_format gateway_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"level":"INFO",'
        '"logger":"nginx.gateway",'
        '"request_id":"$trace_request_id",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log gateway_json;

    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=chat_zone:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=60r/m;
    limit_req_status 429;

    upstream fastapi_backend {
        server app:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        if ($request_method !~ ^(GET|POST|DELETE|OPTIONS)$) {
            return 405;
        }

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error_code":"GATEWAY_RATE_LIMIT","message":"Too many requests at API Gateway. Please slow down."}';
        }

        # 1. مسار المصادقة ومسار الإدارة (أعلى مستوى حماية)
        location ~ ^/api/v1/(auth|admin)/ {
            limit_req zone=auth_zone burst=3 nodelay;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://fastapi_backend;
        }

        # 2. مسار رفع الملفات (رفع السقف إلى 22MB هنا فقط)
        location = /api/v1/documents/upload {
            limit_req zone=upload_zone burst=5 nodelay;
            client_max_body_size 22M;
            client_body_buffer_size 1M;

            include /etc/nginx/proxy_params.conf;
            proxy_pass http://fastapi_backend;

            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # 3. مسار البث المباشر (SSE Streaming بدون تخزين مؤقت)
        location = /api/v1/chat/ask/stream {
            limit_req zone=chat_zone burst=10 nodelay;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://fastapi_backend;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 120s;
        }

        # 4. مسار الشات العادي
        location /api/v1/chat/ {
            limit_req zone=chat_zone burst=10 nodelay;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://fastapi_backend;
            proxy_read_timeout 60s;
        }

        # 5. مسار فحص الجاهزية
        location = /health {
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://fastapi_backend;
            access_log off;
        }

        # 6. باقي المسارات
        location / {
            limit_req zone=general_zone burst=20 nodelay;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://fastapi_backend;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
